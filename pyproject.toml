[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-generic"
version = "1.0.0"
description = "Development agent using LangGraph, LangChain, and Deep Agents"
requires-python = ">=3.11"
dependencies = ["deepagents>=0.4,<1", "langgraph>=1,<2", "langchain>=1,<2", "langchain-openai>=1,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2,<3", "pyyaml>=6,<7", "python-dotenv>=1,<2", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "python-semantic-release==10.7.0"]
anthropic = ["langchain-anthropic>=1,<2"]
gcp = ["google-auth>=2,<3", "requests>=2,<3"]
ollama = ["langchain-ollama>=1,<2"]

[tool.setuptools.packages.find]
include = ["agents*", "orchestration*", "tools*", "models*", "sandbox*", "api*", "evaluations*"]

[tool.setuptools.package-data]
models = ["config.yaml"]

[tool.pytest.ini_options]
testpaths = ["evaluations/tests/unit", "evaluations/tests/functional"]
addopts = "--strict-markers"
markers = [
  "unit: isolated component tests",
  "functional: public API behavior and delivery flow with simulated dependencies",
  "integration: real contracts with libraries or external infrastructure",
]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ['E4', 'E7', 'E9', 'F', 'I']

[tool.semantic_release]
commit_parser = "conventional"
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): {version}"
allow_zero_version = false
major_on_zero = true

[tool.semantic_release.branches.main]
match = "^main$"
prerelease = false

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }
